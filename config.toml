# Конфигурация TonePlayer.
# Файл всегда остаётся внешним и должен находиться рядом с исполняемым файлом.

# -----------------------------------------------------------------------------
# Воспроизведение.
# -----------------------------------------------------------------------------
[playback]

# Количество контрольных частот. Должно совпадать с длиной f_i и gain_db_i.
number_of_constants = 20

# Центральные частоты, Гц. Порядок значений совпадает с порядком gain_db_i.
f_i = [
    500, 1200, 2400, 3600, 5000,
    6500, 8000, 9500, 11000, 13000,
    15000, 17500, 19000, 21000, 23500,
    25000, 27000, 28500, 30000, 31500
]

# Время воспроизведения одной частоты, секунды.
seconds_per_tone = 10.0

# Целевое звуковое давление на выходе акустической системы, дБ.
target_spl_db = 90.0

# -----------------------------------------------------------------------------
# Калибровка уровня.
# Значения подбираются звукомером: при усилении колонок до целевого давления
# измеренный уровень на частоте должен совпадать с target_spl_db.
# -----------------------------------------------------------------------------
[calibration]

# Ослабление каждой частоты относительно полной шкалы, дБ (0 дБ = 1.0).
# Заполняется прибором; до калибровки во всех точках одинаковое значение.
gain_db_i = [
    -12.0, -12.0, -12.0, -12.0, -12.0,
    -12.0, -12.0, -12.0, -12.0, -12.0,
    -12.0, -12.0, -12.0, -12.0, -12.0,
    -12.0, -12.0, -12.0, -12.0, -12.0
]

# -----------------------------------------------------------------------------
# Параметры вывода.
# -----------------------------------------------------------------------------
[output]

# Частота дискретизации потока, Гц.
sample_rate = 48000

# Длительность нарастания и затухания тона на его границах, мс.
fade_ms = 20.0

# Устройство вывода: индекс PortAudio, часть названия или "default".
# Индексы PortAudio нестабильны между запусками, поэтому по умолчанию берётся
# системное устройство вывода, а конкретное устройство выбирается в окне.
device = "default"

# Начальное положение ползунка уровня относительно gain_db_i, дБ.
default_offset_db = 0.0