[project]
name = "tone-player"
version = "0.1.0"
description = "Генератор контрольных тонов для акустических измерений"
requires-python = "==3.14.8"
dependencies = ["pyqt6==6.11.0", "sounddevice==0.5.6"]

[dependency-groups]
dev = ["basedpyright==1.40.2", "ruff==0.17.1"]
build = ["pyinstaller==6.22.3", "nuitka==4.3"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"stubs/**" = ["N818"]
"tests/**" = ["N802", "S101"]

[tool.ruff.lint.pep8-naming]
# CamelCase override names, required by Qt (перекрытия событий Qt).
ignore-names = [
    "paintEvent",
    "mouseReleaseEvent",
    "mousePressEvent",
    "mouseDoubleClickEvent",
    "contextMenuEvent",
    "enterEvent",
    "leaveEvent",
    "wheelEvent",
    "keyPressEvent",
    "closeEvent",
    "setUp",
    "setUpClass",
    "focusInEvent",
    "focusOutEvent",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
stubPath = "stubs"
typeCheckingMode = "strict"
failOnWarnings = true
reportAny = true
reportExplicitAny = true
reportUnknownParameterType = true
reportUnknownArgumentType = true
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownLambdaType = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportPrivateUsage = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnreachable = true

[tool.uv]
package = false
